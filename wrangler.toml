name = "c"
main = "worker.js"
compatibility_date = "2026-07-27"

# KV 네임스페이스 바인딩. id 값은 아래 명령으로 직접 만든 뒤 채워 넣어야 함:
#   npx wrangler kv namespace create DASH_KV
# 실행하면 콘솔에 id가 출력됨 (그 값을 아래 id = "..." 에 붙여넣기)
[[kv_namespaces]]
binding = "DASH_KV"
id = "ab10b3b77bb04d2ca81d2b0ee6755d94"

[ai]
binding = "AI"

# 1분마다 백그라운드에서 buildDashboard 실행 (scheduled 핸들러 트리거)
[triggers]
crons = ["* * * * *"]

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
